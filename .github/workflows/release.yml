name: Production Release
on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.2.3, etc.

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for better release notes

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Cache Gradle dependencies

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Cache Flutter SDK and pub dependencies

      - name: Get Flutter version
        id: flutter-version
        run: echo "version=$(flutter --version | head -n 1)" >> $GITHUB_OUTPUT

      - name: Flutter Doctor
        working-directory: ./App
        run: flutter doctor -v

      - name: Flutter Clean
        working-directory: ./App
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ./App
        run: flutter pub get

      - name: Run Tests (if any)
        working-directory: ./App
        continue-on-error: true # Don't fail if no tests exist
        run: flutter test

      - name: Build APK (Release)
        working-directory: ./App
        run: flutter build apk --release --split-per-abi

      - name: Build APK (Universal)
        working-directory: ./App
        run: flutter build apk --release

      - name: Get App Version
        id: app-version
        working-directory: ./App
        run: |
          VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Rename Artifacts
        working-directory: ./App
        run: |
          # Rename universal APK
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/AucorsaBus-${{ steps.app-version.outputs.version }}.apk
          
          # Rename split APKs
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
               build/app/outputs/flutter-apk/AucorsaBus-${{ steps.app-version.outputs.version }}-armeabi-v7a.apk
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
               build/app/outputs/flutter-apk/AucorsaBus-${{ steps.app-version.outputs.version }}-arm64-v8a.apk
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
               build/app/outputs/flutter-apk/AucorsaBus-${{ steps.app-version.outputs.version }}-x86_64.apk
          fi

      - name: Generate Checksums
        working-directory: ./App/build/app/outputs/flutter-apk
        run: |
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Create Release Notes
        id: release-notes
        run: |
          cat > release_notes.md << 'EOF'
          ## AucorsaBus ${{ github.ref_name }}
          
          ### 📱 Downloads
          
          **Universal APK** (Works on all devices, larger size):
          - `AucorsaBus-${{ steps.app-version.outputs.version }}.apk`
          
          **Architecture-specific APKs** (Smaller size, choose based on your device):
          - `AucorsaBus-${{ steps.app-version.outputs.version }}-arm64-v8a.apk` - For modern Android devices (64-bit ARM)
          - `AucorsaBus-${{ steps.app-version.outputs.version }}-armeabi-v7a.apk` - For older Android devices (32-bit ARM)
          - `AucorsaBus-${{ steps.app-version.outputs.version }}-x86_64.apk` - For Android emulators (64-bit x86)
          
          > ℹ️ If unsure which to download, use the **Universal APK**.
          
          ### 🔒 Verification
          
          SHA256 checksums are available in `checksums.txt` to verify file integrity.
          
          ### 🔧 Build Information
          
          - **Flutter Version:** ${{ steps.flutter-version.outputs.version }}
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Git Commit:** ${{ github.sha }}
          
          ---
          
          ### 📋 Changes in this Release
          
          EOF

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "AucorsaBus ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --generate-notes \
            ./App/build/app/outputs/flutter-apk/*.apk \
            ./App/build/app/outputs/flutter-apk/checksums.txt

      - name: Upload Build Artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-build-${{ github.ref_name }}
          path: |
            ./App/build/app/outputs/flutter-apk/*.apk
            ./App/build/app/outputs/flutter-apk/checksums.txt
          retention-days: 30
